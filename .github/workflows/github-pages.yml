name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 05:30 UTC (06:30 CET / 07:30 CEST) — publication quotidienne du calendrier
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: github-pages

    steps:
      - uses: actions/checkout@v7

      - name: Use ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - uses: pnpm/action-setup@v6
        name: Install
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ruby dependencies
        run: pnpm --filter=www install:jekyll

      - name: Privacy
        run: pnpm check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}

      - name: Validate generated site
        run: pnpm validate:html && pnpm validate:site

      # force_orphan : gh-pages ne garde que le build courant. Chaque build contient les
      # contacts des organisateurs ; un historique les conserverait au-delà de la purge
      # à un an des mentions légales (§4.1).
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www/_site
          cname: www.vtt.bzh
          force_orphan: true
