name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 05:30 UTC (06:30 CET / 07:30 CEST) — publication quotidienne du calendrier
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: github-pages

    steps:
      - uses: actions/checkout@v7

      - name: Use ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - uses: pnpm/action-setup@v6
        name: Install
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ruby dependencies
        run: pnpm --filter=www install:jekyll

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}

      - name: Validate generated site
        run: pnpm validate:html && pnpm validate:site

      # Les parcours navigateur ne valident que le code : la publication
      # quotidienne (schedule) ne change que les données et s'en dispense.
      - name: Cache Playwright browser
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # L'image ubuntu-24.04 embarque déjà les bibliothèques système de
      # Chromium : pas de --with-deps (apt), seulement le shell headless.
      - name: Install Playwright browser
        if: github.event_name != 'schedule'
        timeout-minutes: 3
        run: pnpm exec playwright install --only-shell chromium

      - name: Test browser journeys
        if: github.event_name != 'schedule'
        timeout-minutes: 5
        run: pnpm test:e2e

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www/_site
          cname: www.vtt.bzh
