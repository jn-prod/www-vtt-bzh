name: Generate La Sortie source brief

on:
  workflow_dispatch:

concurrency:
  group: rando-bretagne-next-month
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve next month
        id: period
        run: |
          current_month="$(TZ=Europe/Paris date +%Y-%m-01)"
          period="$(TZ=Europe/Paris date -d "$current_month +1 month" +%Y-%m)"
          echo "PERIOD=$period" >> "$GITHUB_ENV"
          echo "### Matière calendrier pour La Sortie — $period" >> "$GITHUB_STEP_SUMMARY"
          echo "La période est calculée automatiquement à M+1 en heure de Paris." >> "$GITHUB_STEP_SUMMARY"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate source brief
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: pnpm newsletter:new -- --period="$PERIOD" --stdout > "$RUNNER_TEMP/rando-bretagne-$PERIOD.md"

      - name: Upload source brief
        uses: actions/upload-artifact@v4
        with:
          name: rando-bretagne-source-${{ env.PERIOD }}
          path: ${{ runner.temp }}/rando-bretagne-${{ env.PERIOD }}.md
          retention-days: 7

      - name: Explain editorial handoff
        run: |
          echo "Télécharger l’artefact, sélectionner et contextualiser la matière dans l’édition canonique sur nicolasjouanno.com, puis relire avant l’envoi manuel dans Kit." >> "$GITHUB_STEP_SUMMARY"
          echo "Aucun contenu n’est publié, aucune branche ni PR n’est créée par cette action." >> "$GITHUB_STEP_SUMMARY"
