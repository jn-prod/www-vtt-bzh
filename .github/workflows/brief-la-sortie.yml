name: Brief La Sortie

# Matière calendrier d'une édition, sans VPS : depuis l'onglet Actions (ou l'app GitHub),
# choisir la fenêtre. Le workflow lance `pnpm newsletter:new`, vérifie la confidentialité
# puis commite le brief dans www/_drafts (non publié).
on:
  workflow_dispatch:
    inputs:
      debut:
        description: 'Premier jour AAAA-MM-JJ (inclus)'
        required: true
        type: string
      fin:
        description: 'Dernier jour AAAA-MM-JJ (inclus)'
        required: true
        type: string
      regenerer:
        description: 'Réécrire le brief s’il existe déjà'
        type: boolean
        default: false
      maintenant:
        description: 'Commiter sans attendre la fin de la fenêtre protégée (férié, congé : équivaut à --no-verify)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brief-la-sortie
  cancel-in-progress: false

jobs:
  # Pendant la fenêtre protégée, le brief attend le prochain créneau (13:00 ou 20:00, heure
  # de Paris) au lieu d'échouer : on peut le lancer à toute heure, depuis le téléphone.
  creneau:
    if: ${{ !inputs.maintenant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/attendre-creneau.sh
          sparse-checkout-cone-mode: false

      - name: Attendre le prochain créneau
        run: bash scripts/attendre-creneau.sh

  brief:
    needs: creneau
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      # Reliquat : une attente est plafonnée à 350 min, sous la limite de 6 h d'un job.
      - name: Attendre le prochain créneau
        if: ${{ !inputs.maintenant }}
        run: bash scripts/attendre-creneau.sh

      - uses: pnpm/action-setup@v6
        name: Install
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Brief
        env:
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
          REGENERER: ${{ inputs.regenerer }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          set -- "--start=$DEBUT" "--end=$FIN"
          [ "$REGENERER" = "true" ] && set -- "$@" --update
          pnpm newsletter:new -- "$@"

      - name: Privacy
        run: pnpm check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Commit
        env:
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          if [ -z "$(git status --porcelain -- www/_drafts)" ]; then
            echo 'Brief inchangé, rien à commiter.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- www/_drafts
          git commit -m "draft(la-sortie): brief calendrier du ${DEBUT} au ${FIN}"
          git push origin HEAD:main
