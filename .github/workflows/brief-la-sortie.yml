name: Brief La Sortie

# Matière calendrier d'une édition, sans VPS. Seul le 15 de chaque mois, pour l'édition du
# mois suivant (du 1er au 1er + 35 jours, programme La Sortie de corp-ai/AGENTS.md), ou
# depuis l'onglet Actions (ou l'app GitHub) avec une autre fenêtre. Le workflow lance
# `pnpm newsletter:new`, vérifie la confidentialité puis commite le brief dans www/_drafts
# (non publié).
on:
  schedule:
    # 19:15 UTC : hors fenêtre protégée en heure d'hiver comme d'été.
    - cron: '15 19 15 * *'
  workflow_dispatch:
    inputs:
      debut:
        description: 'Premier jour AAAA-MM-JJ (inclus). Vide : 1er du mois suivant'
        required: false
        type: string
      fin:
        description: 'Dernier jour AAAA-MM-JJ (inclus). Vide : début + 35 jours'
        required: false
        type: string
      regenerer:
        description: 'Réécrire le brief s’il existe déjà'
        type: boolean
        default: false
      maintenant:
        description: 'Commiter sans attendre la fin de la fenêtre protégée (férié, congé : équivaut à --no-verify)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brief-la-sortie
  cancel-in-progress: false

jobs:
  # Pendant la fenêtre protégée, le brief attend le prochain créneau (13:00 ou 20:00, heure
  # de Paris) au lieu d'échouer : on peut le lancer à toute heure, depuis le téléphone.
  creneau:
    if: ${{ !inputs.maintenant }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/attendre-creneau.sh
          sparse-checkout-cone-mode: false

      - name: Attendre le prochain créneau
        run: bash scripts/attendre-creneau.sh

  brief:
    needs: creneau
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      # Reliquat : une attente est plafonnée à 350 min, sous la limite de 6 h d'un job.
      - name: Attendre le prochain créneau
        if: ${{ !inputs.maintenant }}
        run: bash scripts/attendre-creneau.sh

      - uses: pnpm/action-setup@v6
        name: Install
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Période
        id: periode
        env:
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          debut=${DEBUT:-$(TZ=Europe/Paris date -d "$(TZ=Europe/Paris date +%Y-%m-01) +1 month" +%F)}
          fin=${FIN:-$(date -d "$debut +35 days" +%F)}
          echo "debut=$debut" >> "$GITHUB_OUTPUT"
          echo "fin=$fin" >> "$GITHUB_OUTPUT"
          echo "Fenêtre : $debut → $fin"

      - name: Brief
        env:
          DEBUT: ${{ steps.periode.outputs.debut }}
          FIN: ${{ steps.periode.outputs.fin }}
          REGENERER: ${{ inputs.regenerer }}
          PROGRAMME: ${{ github.event_name == 'schedule' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          if [ "$PROGRAMME" = "true" ] && ls www/_drafts/"${DEBUT}"_*-la-sortie.md >/dev/null 2>&1; then
            echo "Brief déjà généré pour le mois de ${DEBUT} : rien à faire."
            exit 0
          fi
          set -- "--start=$DEBUT" "--end=$FIN"
          [ "$REGENERER" = "true" ] && set -- "$@" --update
          pnpm newsletter:new -- "$@"

      - name: Privacy
        run: pnpm check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}

      - name: Commit
        env:
          DEBUT: ${{ steps.periode.outputs.debut }}
          FIN: ${{ steps.periode.outputs.fin }}
        run: |
          if [ -z "$(git status --porcelain -- www/_drafts)" ]; then
            echo 'Brief inchangé, rien à commiter.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- www/_drafts
          git commit -m "draft(la-sortie): brief calendrier du ${DEBUT} au ${FIN}"
          git push origin HEAD:main
