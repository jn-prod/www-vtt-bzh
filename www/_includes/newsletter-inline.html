<section
  class="newsletter-inline"
  id="newsletter"
  aria-labelledby="newsletter-title"
>
  <h2 class="newsletter-inline__title" id="newsletter-title">
    L’agenda VTT par e-mail
  </h2>
  <p class="newsletter-inline__text">
    Chaque mois, les randos à retenir en Bretagne, avec un coin à découvrir et
    les nouvelles des chemins.
  </p>
  <form
    class="newsletter-inline__form"
    action="https://app.kit.com/forms/9677378/subscriptions"
    method="post"
  >
    <label class="u-sr-only" for="newsletter-email">Votre adresse e-mail</label>
    <input
      class="newsletter-inline__input"
      id="newsletter-email"
      type="email"
      name="email_address"
      placeholder="vous@exemple.fr"
      autocomplete="email"
      required
    />
    <button type="submit" class="btn btn--primary">Recevoir l’agenda</button>
  </form>
  <p class="newsletter-inline__note">
    Une fois par mois. Désabonnement en un clic.
  </p>
  <p class="newsletter-inline__archives">
    <a
      href="https://www.nicolasjouanno.com/newsletter/?utm_source=vtt-bzh&utm_medium=site&utm_campaign=rando-bretagne&utm_content=archives"
      >Voir les éditions précédentes</a
    >
  </p>
</section>
