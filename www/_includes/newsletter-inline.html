<!-- Bloc agenda email inline : capture email owned.
     Promesse volontairement UTILITAIRE (« le calendrier, chaque mois »), pas
     éditoriale (« suis mes articles ») : les visiteurs de la home viennent pour
     le calendrier, pas pour l'auteur. Le transfert de chaque édition est la
     mécanique fédérale qui fait connaître ce service sans mélanger cette liste
     avec la newsletter outdoor personnelle de nicolasjouanno.com.
     Formulaire HTML natif qui POST directement vers Kit (form dédié 0f9b5b248a,
     endpoint 9677378). Volontairement SANS le script d'embed Kit : celui-ci
     charge Google reCAPTCHA + écrit un identifiant persistant (localStorage
     "ckid") + POST un "formvisit" au chargement — ce qui rendrait faux le
     « aucun cookie ni traceur » de /terms/legals.html sur 98 % du trafic.
     Ici : zéro script Kit, cookie Kit ou identifiant persistant avant l'envoi.
     Anti-spam = double opt-in Kit (l'inscription n'est effective qu'après
     confirmation par email). Le site conserve par ailleurs sa mesure d'audience
     Cloudflare sans cookie, décrite dans les mentions légales. -->
<section
  class="newsletter-inline"
  id="newsletter"
  aria-labelledby="newsletter-title"
>
  <h2 class="newsletter-inline__title" id="newsletter-title">
    Ne rate plus une rando
  </h2>
  <p class="newsletter-inline__text">
    En saison, au maximum un email par mois avec les randos à venir en Bretagne.
    Aucun email vide, désabonnement en un clic.
  </p>
  <form
    class="newsletter-inline__form"
    action="https://app.kit.com/forms/9677378/subscriptions"
    method="post"
  >
    <label class="u-sr-only" for="newsletter-email">Ton adresse email</label>
    <input
      class="newsletter-inline__input"
      id="newsletter-email"
      type="email"
      name="email_address"
      placeholder="ton@email.fr"
      autocomplete="email"
      required
    />
    <button type="submit" class="btn btn--primary">Recevoir l'agenda</button>
  </form>
  <p class="newsletter-inline__archives">
    <a href="/newsletter/">Voir les précédents agendas</a>
  </p>
</section>
