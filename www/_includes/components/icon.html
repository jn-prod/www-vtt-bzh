<span class="icon icon--{{ include.name | escape }}" aria-hidden="true">
  {% if include.name == "vtt-bzh" %}
  <svg viewBox="0 0 259 359" focusable="false">
    <use href="/assets/images/logo-mark.svg#vtt-bzh"></use>
  </svg>
  {% else %}
  <svg focusable="false">
    <use href="#icon-{{ include.name | escape }}"></use>
  </svg>
  {% endif %}
</span>
